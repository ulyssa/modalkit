[package]
name = "modalkit"
version = "0.0.27"
homepage = "https://github.com/ulyssa/modalkit/tree/main/crates/modalkit"
readme = "README.md"
description = "A library for building applications that use modal editing"
exclude = [".github", "CONTRIBUTING.md"]
keywords = ["modal", "vim", "emacs", "kakoune"]
categories = ["command-line-interface", "text-editors"]

edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
clipboard = ["dep:arboard", "dep:image", "dep:wl-clipboard-rs"]

[dependencies]
anymap2 = "0.13.0"
bitflags = { workspace = true }
crossterm = { workspace = true }
editor-types = { workspace = true }
intervaltree = { workspace = true }
keybindings = { workspace = true }
nom = { workspace = true }
radix_trie = "0.3.0"
regex = { workspace = true }
ropey = "1.5.0"
thiserror = { workspace = true }
unicode-segmentation = { workspace = true }
unicode-width = { workspace = true }
shellexpand = "3.1.1"

[dependencies.derive_more]
version = "2.1.1"
features = ["add", "from", "into"]

[dependencies.arboard]
version = "^3.3.2"
optional = true
features = ["wayland-data-control"]

[target.'cfg(target_os = "linux")'.dependencies.image]
version = "0.25.0"
optional = true
default-features = false

[target.'cfg(target_os = "linux")'.dependencies.wl-clipboard-rs]
version = "0.9.0"
optional = true

[dev-dependencies]
rand = { workspace = true }
pretty_assertions = "^1.4.1"
temp-dir = { workspace = true }

[lints]
workspace = true
